name: Publish @w6w/expr

# Continuous delivery: every push to main that touches packages/expr publishes the version in
# packages/expr/package.json to npm, unless npm already has it (tests, build and pack smoke first).
# Bumping the version IS the release. Tokenless via OIDC (npm trusted publisher bound to this file
# name, "publish-expr.yml" — never rename it).

on:
  push:
    branches: [main]
    paths: ["packages/expr/**", ".github/workflows/publish-expr.yml"]
  workflow_dispatch:

# Required for OIDC. This is what replaces stored tokens.
permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: packages/expr

jobs:
  verify:
    # Fork guard: a personal fork has no trusted publisher.
    if: github.repository == 'w6w-io/w6w-core'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: package.json and deno.json must agree
        id: ver
        run: |
          PKG="$(node -p "require('./package.json').version")"
          DEN="$(node -p "require('./deno.json').version")"
          if [ "$PKG" != "$DEN" ]; then
            echo "::error::@w6w/expr package.json ($PKG) != deno.json ($DEN)"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

  npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test
        run: deno test -A tests/
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install --global npm@latest
      - run: npm run build
      - name: Pack smoke (tarball contents + ESM/require from a scratch consumer)
        run: bash scripts/pack-smoke.sh
      - run: npm publish --dry-run
      - name: Skip publish if this version is already on the registry
        id: exists
        env:
          VER: ${{ needs.verify.outputs.version }}
        run: |
          if npm view "@w6w/expr@$VER" version >/dev/null 2>&1; then
            echo "::notice::@w6w/expr@$VER is already published; skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: npm detects the OIDC trusted publisher automatically.
      - if: steps.exists.outputs.published != 'true'
        run: npm publish --provenance --access public
