name: Publish @w6w/types (npm)

# Continuous delivery: every push to main that touches packages/types publishes the version in
# packages/types/package.json to npm, unless npm already has it. Bumping the version IS the release:
# there is no tag or GitHub Release to remember. JSR is published by publish-author-packages.yml,
# which orders types before the packages that import it.
#
# Tokenless via OIDC (npm trusted publisher: repo w6w-io/w6w-core, workflow "publish-types.yml" —
# the trust is bound to this FILE NAME, so never rename it).

on:
  push:
    branches: [main]
    paths: ["packages/types/**", ".github/workflows/publish-types.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-types
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/types

jobs:
  npm:
    # Fork guard: a personal fork has no trusted publisher.
    if: github.repository == 'w6w-io/w6w-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: package.json and deno.json must agree
        id: ver
        run: |
          PKG="$(node -p "require('./package.json').version")"
          DEN="$(node -p "require('./deno.json').version")"
          if [ "$PKG" != "$DEN" ]; then
            echo "::error::@w6w/types package.json ($PKG) != deno.json ($DEN)"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
      - name: Already on npm?
        id: exists
        run: |
          if npm view "@w6w/types@${{ steps.ver.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::@w6w/types@${{ steps.ver.outputs.version }} is already on npm; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing (OIDC) requires npm >= 11.5.1.
      - if: steps.exists.outputs.published != 'true'
        run: npm install --global npm@latest
      - if: steps.exists.outputs.published != 'true'
        run: npm publish --provenance --access public
