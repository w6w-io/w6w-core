name: Publish author toolchain (@w6w/types, runtime, validator, app-build) to JSR

# Continuous delivery: every push to main that touches one of the toolchain packages stages them in
# an isolated workspace and dry-runs all of them (scripts/check-author-packages.ts, which also
# enforces the lockstep version), then publishes to JSR each package whose version JSR does not
# have yet, in dependency order: types -> runtime -> validator -> app-build. Bumping the version IS
# the release. npm is separate: publish-types.yml (types) and publish-expr.yml (expr).
#
# Tokenless via OIDC. Each package must exist on jsr.io under the @w6w scope and be linked to the
# GitHub repo w6w-io/w6w-core (package settings -> GitHub repository); a package that is not linked
# fails its publish step loudly rather than being skipped.

on:
  push:
    branches: [main]
    paths:
      - "packages/types/**"
      - "packages/runtime/**"
      - "packages/validator/**"
      - "packages/app-build/**"
      - "packages/expr/**"
      - "scripts/check-author-packages.ts"
      - ".github/workflows/publish-author-packages.yml"
  workflow_dispatch:

concurrency:
  group: publish-author-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  dry-run:
    # Fork guard: a personal fork is not linked on JSR.
    if: github.repository == 'w6w-io/w6w-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Isolated dry-run of all five packages
        run: deno run -A scripts/check-author-packages.ts

  publish:
    needs: dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Publish each package JSR does not have yet (dependency order)
        run: |
          set -euo pipefail
          for p in types runtime validator app-build; do
            name="$(node -p "require('./packages/$p/deno.json').name")"
            ver="$(node -p "require('./packages/$p/deno.json').version")"
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://jsr.io/$name/${ver}_meta.json")"
            if [ "$code" = 200 ]; then
              echo "::notice::$name@$ver is already on JSR"
              continue
            fi
            echo "publishing $name@$ver"
            (cd "packages/$p" && deno publish)
          done
