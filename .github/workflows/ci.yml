name: CI

# Every check lives in scripts/verify.sh, which the pre-push hook (w6w-io/w6w
# .githooks/pre-push) also runs, so a push that passes locally passes here.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bash scripts/verify.sh
